name: osmotool
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - diamond>=2.1
  - prodigal>=2.6
  - hmmer>=3.3
  - orfm>=0.7
  - bwa-mem3        # profile (catalog step) / build-catalog (bwa-mem2 also works)
  - pandas>=1.5
  - xgboost>=3.1   # NaCl-max prediction (annotate --predict_nacl, predict-nacl)
  - pip
  # After activating: pip install -e .  (or pip install osmotool)
  # Dev extras:
  # pip install -e ".[dev]"   →  adds pytest, pytest-cov, xgboost
